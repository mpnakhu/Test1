<style>
:root{--ink:#0e2f33;--teal:#0f766e;--mint:#d9f2ec;--bg:#eef4f3;--card:#fff;--line:#d5e3e0;--amber:#d98a0b;--amberbg:#fff1d6;--ok:#16794a;--muted:#5d7478;--red:#b4332c}
*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{background:linear-gradient(120deg,#0b2a2e,#0f766e);color:#fff;padding:22px 20px 70px}
.wrap{max-width:1040px;margin:0 auto}
header .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.logo{width:62px;height:62px;border-radius:50%;background:#fff;padding:2px;box-shadow:0 2px 10px rgba(0,0,0,.25)}h1{margin:0;font-size:22px}header p{margin:2px 0 0;opacity:.8;font-size:13px}
.btn{border:0;border-radius:10px;padding:9px 15px;font:inherit;font-weight:500;cursor:pointer;background:var(--teal);color:#fff}
.btn:hover{filter:brightness(1.1)}.btn.ghost{background:transparent;color:inherit;border:1px solid currentColor}
.btn.sec{background:var(--mint);color:var(--teal)}.btn.red{background:#fde8e6;color:var(--red)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f5b83d;outline-offset:1px}
main{margin-top:-48px;padding:0 16px 40px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border-radius:14px;padding:14px 16px;border:1px solid var(--line)}
.stat b{display:block;font-size:30px;line-height:1.1}.stat span{color:var(--muted);font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.bar input{flex:1;min-width:180px}
input,select{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;font:inherit;color:var(--muted)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.list{display:grid;gap:12px}
.bill{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--amber);border-radius:14px;padding:14px 16px;cursor:pointer;transition:box-shadow .15s}
.bill:hover{box-shadow:0 6px 20px rgba(14,47,51,.12)}.bill.done{border-left-color:var(--ok)}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.bill h3{margin:0;font-size:17px}.sub{color:var(--muted);font-size:13px}
.badge{border-radius:99px;padding:3px 11px;font-size:12px;font-weight:700;background:var(--amberbg);color:#8a5600}
.badge.ok{background:#d8f3e5;color:var(--ok)}
.prog{height:8px;border-radius:9px;background:#e3ecea;margin:11px 0 6px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#34b6a6);border-radius:9px}
.empty{text-align:center;color:var(--muted);padding:44px 10px;background:#fff;border-radius:14px;border:1px dashed var(--line)}
#ov{position:fixed;inset:0;background:rgba(8,28,31,.55);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px;z-index:9}
#m{background:#fff;border-radius:18px;width:100%;max-width:680px;padding:20px;animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(10px);opacity:0}}@media(prefers-reduced-motion:reduce){#m{animation:none}}
#m h2{margin:0 0 12px;font-size:19px}label{font-size:13px;color:var(--muted);display:block;margin:10px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.it{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px dashed var(--line)}.it .nm{grid-column:1/4}.it .f small{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}.it .x{align-self:end;justify-self:end}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}.chips .chip{padding:4px 11px;font-size:13px}.dots{display:flex;align-items:center;margin:14px 0 6px;overflow-x:auto;padding:4px 2px}.dot{flex:none;width:28px;height:28px;border-radius:50%;background:#e3ecea;color:var(--muted);display:grid;place-items:center;font-size:12px;font-weight:700}.dot.d{background:var(--teal);color:#fff}.dot.n{background:var(--amberbg);color:#8a5600;box-shadow:0 0 0 2px var(--amber)}.dots i{flex:1;min-width:6px;height:3px;background:#e3ecea}.dots i.d{background:var(--teal)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}td.r,th.r{text-align:right}
.tl{position:relative;margin:8px 0 0 10px;padding-left:26px;border-left:3px solid var(--line)}
.st{position:relative;padding:0 0 18px}.st:last-child{padding-bottom:0}
.st:before{content:'';position:absolute;left:-37px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--line)}
.st.d:before{background:var(--teal);border-color:var(--teal)}.st.n:before{border-color:var(--amber);background:var(--amberbg)}
.st.d{border-color:var(--teal)}.st b{font-weight:500}.st.p{color:#93a5a8}
.who{display:inline-block;background:var(--mint);color:var(--teal);border-radius:8px;padding:1px 9px;font-size:13px;margin-right:6px}
.act{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.act select{flex:1;min-width:140px}.act .btn{padding:8px 12px}
.foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:18px}
.tag{display:inline-flex;gap:5px;background:var(--mint);color:var(--teal);padding:3px 5px 3px 11px;border-radius:99px;margin:3px;font-size:13px}
.tag button{border:0;background:none;color:var(--red);cursor:pointer;font-size:15px}
pre{background:#0e2f33;color:#cfe;padding:10px;border-radius:10px;overflow:auto;font-size:12px;max-height:160px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;display:none;z-index:20}
.bars .r{display:grid;grid-template-columns:190px 1fr 125px 70px;gap:8px;align-items:center;margin:6px 0;font-size:14px}.bars .b{height:14px;background:#e3ecea;border-radius:9px;overflow:hidden}.bars .b i{display:block;height:100%;background:var(--teal);border-radius:9px}.bars .slow .b i{background:var(--amber)}.bars .w{color:var(--muted);font-size:13px;text-align:right}
body.lo header,body.lo main{display:none}
#login{display:none;position:fixed;inset:0;z-index:30;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,#0b2a2e,#0f766e);overflow:auto}
.lc{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:400px;text-align:center}.lc .logo{width:84px;height:84px;margin:0 auto 6px;display:block;box-shadow:none}.lc h2{margin:6px 0 2px;font-size:19px}.lc label,.lc details{text-align:left}.lc .tabs{display:flex;gap:8px;justify-content:center;margin:14px 0 4px}
textarea{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;width:100%;resize:vertical;color:var(--ink)}textarea:focus-visible{outline:3px solid #f5b83d;outline-offset:1px}.note{margin-top:8px;background:var(--amberbg);color:#6b4300;border-radius:8px;padding:6px 10px;font-size:13px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
[hidden]{display:none!important}.pg{background:#fff;border-radius:18px;padding:20px;max-width:760px;margin:0 auto;border:1px solid var(--line)}.pg h2{margin:0 0 4px;font-size:20px}
.tt{display:inline-block;border-radius:6px;padding:1px 9px;font-size:12px;font-weight:700;margin-right:6px}
.gh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:18px 2px 2px;padding-bottom:4px;border-bottom:2px solid var(--line);font-size:14px}.gh span{color:var(--muted)}
.pl{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px;margin:0}.pl select{width:auto;min-width:130px}
.sp{margin:8px 0 4px;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:14px}.ck2,.rv{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:6px 0;border-bottom:1px dashed var(--line)}.ck2>span,.rv>span{flex:1;min-width:150px}.ck2 label{display:inline-flex;gap:4px;align-items:center;margin:0;font-size:13px;color:var(--ink)}.ck2 input[type=checkbox]{width:auto}.rv input[type=number]{width:86px;padding:5px 8px}.rv em{font-style:normal;font-size:12px;min-width:78px;font-weight:700}.rv .chip{padding:2px 10px;font-size:12px}
.sb{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700}.sb.ok{background:#d8f3e5;color:var(--ok)}.sb.bad{background:#fde8e6;color:var(--red)}.sb.warn{background:var(--amberbg);color:#8a5600}.sb.mu{background:#e8eeed;color:var(--muted)}.rv em.ok{color:var(--ok)}.rv em.bad{color:var(--red)}.rv em.warn{color:#8a5600}.rv em.mu,.rv.mu{color:var(--muted)}
.fls{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.fl{border-radius:8px;padding:4px 10px;font-size:12.5px}.fl.bad{background:#fde8e6;color:var(--red)}.fl.warn{background:var(--amberbg);color:#8a5600}.fl.ok{background:#d8f3e5;color:var(--ok)}.fl.mu{background:#e8eeed;color:var(--muted)}
.ra{flex-basis:100%;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;margin:2px 0 4px}.ra a{color:var(--teal);font-weight:700;cursor:pointer}
.rt{overflow-x:auto}.rt tr.k{cursor:pointer}.rt tr.k:hover{background:var(--bg)}.mini{display:inline-flex;gap:2px}.mini s{width:9px;height:9px;border-radius:50%;background:#e3ecea}.mini s.d{background:var(--teal)}.mini s.n{background:var(--amber)}h3.s{margin:20px 0 6px;font-size:16px}
@media(max-width:520px){.bars .r{grid-template-columns:100px 1fr 85px;font-size:12px}.bars .w{display:none}}
@media(max-width:520px){.g2{grid-template-columns:1fr}.it{grid-template-columns:1fr 1fr}.it .nm{grid-column:1/2}}

<script>

let S=JSON.parse(localStorage.getItem('nakhuPO')||'null')||{bills:[],people:[],url:''};S.cos=S.cos||[];S.meds=S.meds||[];delete S.cm;if(!S.mig1){S.mig1=1;if((S.url||'').includes('AKfycbxun95'))S.url='';localStorage.setItem('nakhuPO',JSON.stringify(S))}
let flt='all',tmr,lastBy='',RL=[];
const TYPES=['ยา','เวชภัณฑ์ที่มิใช่ยา','กายภาพ','สมุนไพร'];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
let ME=null,TOKEN='',base={},vers={},mv=0,bM='',since=0,pushing=false,netErr=false,lastSync=0,ptm;
const API='https://script.google.com/macros/s/AKfycbxLpc7sFgrJR1U_KAi45Ng3zVS6uucXX8FxKx0aw9JsZyR9Hv1axCofHrhKi0w20Zc8/exec';  // <<< วาง URL ของ Apps Script (ลงท้ายด้วย /exec) ระหว่างเครื่องหมาย ' ' ตรงนี้

const RN={viewer:'ผู้ดู',recorder:'ผู้บันทึก',admin:'ผู้ดูแล'},H=b=>{const{v,...r}=b;return JSON.stringify(r)},mj=()=>JSON.stringify({people:S.people,cos:S.cos,meds:S.meds});
async function api(a,d={}){const u=gurl();if(!u)return{ok:false,err:'ยังไม่ได้ตั้งค่าที่อยู่ระบบ'};
 try{const r=await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({a,t:TOKEN,...d})});const j=await r.json();if(j.auth&&ME)wipe('หมดเวลาการเข้าสู่ระบบ กรุณาเข้าสู่ระบบอีกครั้ง');return j}
 catch(e){return{ok:false,net:true,err:'เชื่อมต่อระบบไม่ได้ ตรวจสอบอินเทอร์เน็ตหรือที่อยู่ระบบ'}}}
function persist(){localStorage.setItem('nakhuPO',JSON.stringify(S));localStorage.setItem('nakhuSync',JSON.stringify({base,vers,mv,bM}))}

function setSync(){const e=$('sync');if(!e)return;if(!ME){e.textContent='';return}const pend=S.bills.some(b=>base[b.id]!==H(b))||mj()!==bM;
 e.textContent='👤 '+ME.name+' ('+RN[ME.role]+') · '+(netErr?'⚠ เชื่อมต่อไม่ได้ จะลองใหม่อัตโนมัติ':pend?'☁ กำลังบันทึกขึ้นระบบ…':lastSync?'☁ ซิงก์ล่าสุด '+new Date(lastSync).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}):'')}
function take(id,r){const i=S.bills.findIndex(b=>b.id==id);if(r.bill){r.bill.v=r.v;i<0?S.bills.push(r.bill):S.bills[i]=r.bill;vers[id]=r.v;base[id]=H(r.bill)}else{if(i>=0)S.bills.splice(i,1);delete base[id];delete vers[id]}persist();render()}
async function push(){if(!ME||pushing)return;pushing=true;let fail=false;
 try{let more=true;while(more&&!fail){more=false;
  for(const b of S.bills.slice()){if(base[b.id]===H(b))continue;more=true;const r=await api('put',{bill:{...b,v:vers[b.id]||0}});
   if(r.ok){vers[b.id]=r.v;b.v=r.v;base[b.id]=H(b);lastSync=Date.now()}
   else if(r.conflict){take(b.id,r);toast('มีผู้อื่นแก้บิลนี้ไปแล้ว โหลดข้อมูลล่าสุดแล้ว กรุณาทำรายการอีกครั้ง')}
   else{fail=true;toast(r.err||'บันทึกขึ้นระบบไม่สำเร็จ');break}}
  if(fail)break;
  for(const id of Object.keys(base)){if(S.bills.some(x=>x.id==id))continue;more=true;const r=await api('put',{bill:{id,v:vers[id]||0},del:true});
   if(r.ok||r.conflict){delete base[id];delete vers[id];lastSync=Date.now()}else{fail=true;toast(r.err||'ลบไม่สำเร็จ');break}}
  if(fail)break;
  if(mj()!==bM){more=true;const r=await api('master',{m:{people:S.people,cos:S.cos,meds:S.meds},mv});
   if(r.ok){mv=r.v;bM=mj();lastSync=Date.now()}
   else if(r.conflict){const m=r.master,u=(a,b)=>[...new Set([...a,...b])];S.people=u(m.people,S.people);S.cos=u(m.cos,S.cos);S.meds=u(m.meds,S.meds);mv=m.v}
   else{fail=true;toast(r.err||'บันทึกรายชื่อไม่สำเร็จ')}}}}
 catch(e){fail=true}
 pushing=false;netErr=fail;persist();setSync();render()}
async function pull(){if(!ME)return;const r=await api('pull',{since,mv});if(!r.ok){netErr=!!r.net;setSync();return}netErr=false;ME=r.me;let ch=0;
 for(const x of r.bills){since=Math.max(since,x.upd||0);const id=x.id,i=S.bills.findIndex(b=>b.id==id),l=S.bills[i];
  if(l&&base[id]!==H(l))continue;if(!l&&base[id]!==undefined)continue;
  if(x.deleted){if(l){S.bills.splice(i,1);ch=1}delete base[id];delete vers[id];continue}
  if(l&&(vers[id]||0)>=x.v)continue;
  const nb={...x.bill,v:x.v};l?S.bills[i]=nb:S.bills.push(nb);vers[id]=x.v;base[id]=H(nb);ch=1}
 if(r.master&&r.master.v>mv&&mj()===bM){S.people=r.master.people;S.cos=r.master.cos;S.meds=r.master.meds;mv=r.master.v;bM=mj();ch=1}
 lastSync=Date.now();persist();render();setSync();push()}
function startTimers(){clearInterval(ptm);ptm=setInterval(()=>{if(ME&&!document.hidden)pull()},20000)}
document.addEventListener('visibilitychange',()=>{if(ME&&!document.hidden)pull()});
function wipe(msg){ME=null;TOKEN='';S={bills:[],people:[],cos:[],meds:[],url:'',mig1:1};base={};vers={};mv=0;bM='';since=0;clearInterval(ptm);
 ['nakhuPO','nakhuSync','nakhuTok'].forEach(k=>localStorage.removeItem(k));sessionStorage.removeItem('nakhuTok');closeM();render();showLogin(msg)}
async function logout(){await api('logout');wipe()}
let LM='L';
function lt(m){LM=m;$('tL').classList.toggle('on',m=='L');$('tR').classList.toggle('on',m=='R');$('rg').hidden=m=='L';$('lrm').style.display=m=='L'?'flex':'none';$('lgo').textContent=m=='L'?'เข้าสู่ระบบ':'สมัครสมาชิก';$('lmsg').textContent='';$('lpw').autocomplete=m=='L'?'current-password':'new-password'}
function showLogin(msg){document.body.classList.add('lo');$('page').innerHTML='';$('page').hidden=true;$('dash').hidden=false;$('login').style.display='flex';lt('L');$('lmsg').style.color='var(--red)';$('lmsg').textContent=msg||'';
 if(!API)$('lmsg').textContent='ยังไม่ได้ตั้งค่า URL ของระบบ (const API ในไฟล์ index.html)'}
async function submitLogin(){const m=$('lmsg');m.style.color='var(--red)';m.textContent='';
 const u=$('lun').value.trim().toLowerCase(),p=$('lpw').value;if(!u||!p){m.textContent='กรอกชื่อผู้ใช้และรหัสผ่าน';return}
 if(LM=='R'){const nm=$('lnm').value.trim();if(!nm){m.textContent='กรอกชื่อที่แสดง';return}if(p!==$('lpw2').value){m.textContent='รหัสผ่านไม่ตรงกัน';return}
  $('lgo').disabled=true;const r=await api('register',{u,p,name:nm});$('lgo').disabled=false;
  if(!r.ok){m.textContent=r.err;return}lt('L');m.style.color='var(--ok)';m.textContent=r.first?'สมัครสำเร็จ คุณเป็นผู้ดูแลระบบคนแรก เข้าสู่ระบบได้เลย':'สมัครสำเร็จ รอผู้ดูแลอนุมัติบัญชีก่อนจึงจะเข้าใช้งานได้';return}
 $('lgo').disabled=true;const r=await api('login',{u,p});$('lgo').disabled=false;
 if(!r.ok){m.textContent=r.err;return}
 TOKEN=r.token;ME=r.user;($('lrmc').checked?localStorage:sessionStorage).setItem('nakhuTok',JSON.stringify({t:TOKEN,me:ME}));$('lpw').value='';
 const lg=S.bills.filter(b=>b.v==null).length;bM=mj();
 if(lg){if(confirm('พบข้อมูลบิลเดิมในเครื่องนี้ '+lg+' บิล\nต้องการอัปโหลดขึ้นระบบกลางหรือไม่?\n(ตกลง = อัปโหลด, ยกเลิก = ไม่ใช้ข้อมูลเดิมในเครื่องนี้)'))bM='';else{S.bills=[];S.people=[];S.cos=[];S.meds=[];bM=mj()}}
 enter()}
async function enter(){document.body.classList.remove('lo');$('login').style.display='none';setSync();render();startTimers();await pull();route()}
function boot(){$('llogo').src=document.querySelector('header img').src;
 const k=JSON.parse(localStorage.getItem('nakhuTok')||sessionStorage.getItem('nakhuTok')||'null');
 if(k&&gurl()){TOKEN=k.t;ME=k.me;const y=JSON.parse(localStorage.getItem('nakhuSync')||'{}');base=y.base||{};vers=y.vers||{};mv=y.mv||0;bM=y.bM??mj();enter()}else showLogin()}
const TC={'ยา':['#2563eb','#dbeafe'],'เวชภัณฑ์ที่มิใช่ยา':['#9333ea','#f3e8ff'],'กายภาพ':['#ea580c','#ffedd5'],'สมุนไพร':['#16a34a','#dcfce7']};
const tcol=b=>TC[b.type||'ยา']||TC['ยา'],ttag=b=>{const c=tcol(b);return`<span class="tt" style="background:${c[1]};color:${c[0]}">${esc(b.type||'ยา')}</span>`};
let tfv='',per='all',grp=localStorage.getItem('nakhuGrp')||'month',fy=localStorage.getItem('nakhuFY')!=='0';
const THM=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'],THS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'],p2=n=>String(n).padStart(2,'0'),be=y=>y+543;
function pkey(t,g){const d=new Date(t),y=d.getFullYear(),m=d.getMonth(),dd=d.getDate();
 if(g=='day')return{k:`${y}-${p2(m+1)}-${p2(dd)}`,l:`${dd} ${THM[m]} ${be(y)}`};
 if(g=='week'){const a=new Date(y,m,dd-((d.getDay()+6)%7)),z=new Date(a.getFullYear(),a.getMonth(),a.getDate()+6);return{k:`${a.getFullYear()}-${p2(a.getMonth()+1)}-${p2(a.getDate())}`,l:`สัปดาห์ ${a.getDate()} ${THS[a.getMonth()]} – ${z.getDate()} ${THS[z.getMonth()]} ${be(z.getFullYear())}`}}
 if(g=='month')return{k:`${y}-${p2(m+1)}`,l:`${THM[m]} ${be(y)}`};
 const FY=fy&&m>=9?y+1:y;
 if(g=='quarter'){const q=fy?Math.floor(((m+3)%12)/3)+1:Math.floor(m/3)+1,s0=fy?((q-1)*3+9)%12:(q-1)*3;return{k:`${FY}-Q${q}`,l:`ไตรมาส ${q}/${be(FY)} (${THS[s0]}–${THS[(s0+2)%12]})`}}
 return{k:String(FY),l:fy?`ปีงบประมาณ ${be(FY)}`:`ปี ${be(y)}`}}
const q_=i=>i.qty??1,isNone=i=>i.ord!==false&&i.rcv===0,isShort=i=>i.ord!==false&&i.rcv!=null&&i.rcv<q_(i),pendNo=i=>i.ord===false&&!i.res,pendSh=i=>isShort(i)&&!i.res,hasShort=b=>b.items.some(pendSh),hasNoOrd=b=>b.items.some(pendNo),hasWait=b=>b.items.some(i=>i.res==='wait'),clr=i=>{delete i.res;delete i.resTo;delete i.resAt};
const rcvSt=i=>{if(i.ord===false)return{t:'ไม่ได้สั่ง',c:'mu'};if(i.rcv==null)return{t:'ยังไม่บันทึกรับ',c:'mu'};const q=q_(i);if(i.rcv<=0)return{t:'ไม่ส่งมา',c:'bad'};if(i.rcv>=q)return{t:i.rcv>q?'ครบ (เกิน '+(i.rcv-q)+')':'ครบ',c:'ok'};return{t:'ขาด '+(q-i.rcv),c:'warn'}};
const ordLbl=i=>i.ord===true?'<span class="sb ok">สั่งแล้ว</span>':i.ord===false?'<span class="sb bad">ไม่สั่ง</span>':'<span class="sb mu">ยังไม่ระบุ</span>';
const nmList=(a,f)=>esc(a.slice(0,3).map(f).join(', '))+(a.length>3?' … +'+(a.length-3):'');
const noOrdT=b=>b.items.filter(pendNo).map(i=>i.name).join(', '),shortT=b=>b.items.filter(pendSh).map(i=>i.name+(i.rcv===0?' (ไม่ส่งมา)':' (ขาด '+(q_(i)-i.rcv)+')')).join(', ');
const resLbl=i=>i.res==='new'?`✔ เปิดบิลใหม่แล้ว${i.resTo&&bOf(i.resTo)?` → <a onclick="openBill('${i.resTo}')">${esc(ttl(bOf(i.resTo)))}</a>`:''}`:i.res==='wait'?'⏭ รอสั่งรอบถัดไป':'';
const resRow=(id,k,i,ed)=>i.res?`<div class="ra"><span class="sb ok">${resLbl(i)}</span>${ed?`<button class="chip" onclick="clrRes('${id}',${k})">ยกเลิก</button>`:''}</div>`:(ed?`<div class="ra"><span class="sub">ต้องการดำเนินการอย่างไร:</span><button class="btn sec" style="padding:3px 10px;font-size:12px" onclick="newFrom('${id}',[${k}])">เปิดบิลใหม่</button><button class="btn ghost" style="color:var(--muted);padding:3px 10px;font-size:12px" onclick="setRes('${id}',${k},'wait')">รอสั่งรอบถัดไป</button></div>`:'');
const bulk=(b,id,f,lbl)=>{const ix=b.items.map((i,k)=>f(i)?k:-1).filter(k=>k>=0);return ix.length>1?`<div class="act"><button class="btn sec" style="padding:4px 10px;font-size:12px" onclick="newFrom('${id}',[${ix}])">เปิดบิลใหม่ (${lbl} ${ix.length} รายการ)</button><button class="btn ghost" style="color:var(--muted);padding:4px 10px;font-size:12px" onclick="setResAll('${id}',[${ix}])">รอสั่งรอบถัดไป (${lbl} ${ix.length} รายการ)</button></div>`:''};
function flags(b){const it=b.items,no=it.filter(pendNo),od=it.filter(i=>i.ord===true).length,nn=it.filter(i=>isNone(i)&&!i.res),sh=it.filter(i=>pendSh(i)&&i.rcv>0),rc=it.filter(i=>i.ord!==false),rec=rc.filter(i=>i.rcv!=null).length;let h='';
 if(no.length)h+=`<div class="fl bad">🚫 ไม่สั่งซื้อ ${no.length} รายการ: ${nmList(no,i=>i.name)}</div>`;
 if(od||it.some(i=>i.ord===false))h+=`<div class="fl mu">🛒 สั่งซื้อแล้ว ${od}/${it.length} รายการ</div>`;else if(b.steps[1])h+='<div class="fl warn">🛒 ยังไม่ได้ติ๊กรายการที่สั่งซื้อ</div>';
 if(nn.length)h+=`<div class="fl bad">📦 ไม่ส่งมา ${nn.length} รายการ: ${nmList(nn,i=>i.name)}</div>`;

 if(rec&&!it.some(isShort)&&rec==rc.length)h+='<div class="fl ok">📦 รับของครบแล้ว</div>';else if(!rec&&b.steps[3]&&rc.length)h+='<div class="fl warn">📦 ยังไม่ได้บันทึกจำนวนที่รับ</div>';

function exportAll(){if(!xl())return;const L=RL,wb=XLSX.utils.book_new();if(!L.length)return toast('ไม่มีบิลให้ส่งออก');
 const nm=b=>[b.name||'',b.no||'',b.company,b.type||'ยา'];
 sheet(wb,'สรุปบิล',[['ชื่อบิล','เลขที่บิล','บริษัท','ชนิด','วันที่สร้าง','สถานะ','วันที่สิ้นสุด','จำนวนรายการ','ยอดรวม (บาท)','บันทึกแล้ว','ขั้นที่ยังไม่ลง','ใช้เวลารวม','หมายเหตุ','รายการที่ไม่สั่งซื้อ','รายการไม่ส่งมา/ขาดส่ง',...STEPS.map((s,i)=>`ขั้น ${i+1} ${s}`)],...L.map(b=>[...nm(b),dt(b.created),b.done?'สิ้นสุดแล้ว':'กำลังดำเนินการ',dt(b.doneAt),b.items.length,total(b),step(b)+'/10',left(b),fmtD((b.done?b.doneAt:Date.now())-b.created),b.note||'',noOrdT(b),shortT(b),...b.steps.map(r=>r?dt(r.t)+' ('+r.by+')':'')])]);
 sheet(wb,'รายการเวชภัณฑ์',[['ชื่อบิล','เลขที่บิล','บริษัท','ชนิด','รายการเวชภัณฑ์','บรรจุ','จำนวน','ราคา/หน่วย (บาท)','รวม (บาท)','สั่งซื้อ','จำนวนที่รับ','ขาด','สถานะการรับ','การดำเนินการ'],...L.flatMap(b=>itemRows(b).map(r=>[...nm(b),...r.slice(1)]))]);
 sheet(wb,'ขั้นตอน (รายละเอียด)',[['ชื่อบิล','เลขที่บิล','บริษัท','ชนิด','ขั้นที่','ขั้นตอน','ผู้รับผิดชอบ','วันเวลา','ลำดับที่บันทึก','ระยะเวลาจากครั้งก่อน (ชั่วโมง)'],...L.flatMap(b=>{const q=seqOf(b),du=durs(b);return b.steps.map((r,i)=>r?[...nm(b),i+1,STEPS[i],r.by,dt(r.t),q[i],hr(du[i])]:null).filter(Boolean).sort((a,c)=>a[8]-c[8])})]);
 sheet(wb,'สรุปรายบริษัท',[['บริษัท','จำนวนบิล','ค้าง','เสร็จ','มูลค่า (บาท)','เวลาเฉลี่ยต่อบิล (ชั่วโมง)'],...[...new Set(L.map(b=>b.company))].sort().map(c=>{const x=L.filter(b=>b.company==c),d=x.filter(b=>b.done);return[c,x.length,x.length-d.length,d.length,x.reduce((a,b)=>a+total(b),0),hr(avg(d.map(b=>b.doneAt-b.created)))]})]);
 sheet(wb,'เวลาเฉลี่ยแต่ละขั้น',[['ขั้นที่','ขั้นตอน','เวลาเฉลี่ย (ชั่วโมง)','จำนวนบิลที่มีข้อมูล','ยังไม่ลง (บิลที่ยังไม่สิ้นสุด)'],...STEPS.map((s,i)=>{const v=L.map(b=>durs(b)[i]).filter(x=>x!=null);return[i+1,s,hr(avg(v)),v.length,L.filter(b=>!b.done&&!b.steps[i]).length]})]);
 XLSX.writeFile(wb,'รายงานบิล_'+new Date().toISOString().slice(0,10)+'.xlsx');toast('ส่งออก Excel แล้ว')}
function openSet(){const ro=!can();openM(`<h2>ตั้งค่า / บัญชี</h2><div class="sub">เข้าสู่ระบบเป็น <span class="who">${esc(ME.name)}</span> (${esc(ME.u)}) · บทบาท: ${RN[ME.role]}</div>
 <div class="act" style="margin:10px 0"><button class="btn sec" onclick="openPw()">เปลี่ยนรหัสผ่านของฉัน</button>${adm()?'<button class="btn" onclick="openUsers()">จัดการผู้ใช้ / อนุมัติสมาชิก</button>':''}</div>
 ${ro?'':`<label>รายชื่อผู้รับผิดชอบ (ใช้เลือกตอนแก้ไขขั้นตอน)</label><div>${S.people.map((p,i)=>`<span class="tag">${esc(p)}<button onclick="S.people.splice(${i},1);save();openSet()" title="ลบ">×</button></span>`).join('')||'<span class="sub">ยังไม่มีรายชื่อ</span>'}</div><button class="btn sec" style="margin-top:6px" onclick="addPerson()">+ เพิ่มชื่อ</button>${catSet()}`}
 <div class="act" style="margin-top:14px"><button class="btn sec" onclick="exportJ()">ดาวน์โหลดสำเนา JSON</button>${ro?'':`<button class="btn sec" onclick="$('imp').click()">นำเข้า JSON</button><input id="imp" type="file" accept=".json" hidden onchange="importJ(this)">`}</div>
 <div class="foot"><button class="btn ghost" style="color:var(--muted)" onclick="closeM()">ปิด</button></div>`)}
async function openUsers(){const r=await api('users');if(!r.ok)return toast(r.err||'ไม่สำเร็จ');const St={active:'ใช้งาน',pending:'รออนุมัติ',disabled:'ปิดใช้งาน'};
 openM(`<h2>จัดการผู้ใช้</h2><div class="rt"><table><tr><th>ผู้ใช้</th><th>บทบาท</th><th>สถานะ</th><th></th></tr>${r.users.map((u,i)=>`<tr><td>${esc(u.name)}<div class="sub">${esc(u.u)}</div></td><td><select id="ur${i}">${Object.keys(RN).map(k=>`<option value="${k}" ${k==u.role?'selected':''}>${RN[k]}</option>`).join('')}</select></td><td><select id="us${i}">${Object.keys(St).map(k=>`<option value="${k}" ${k==u.status?'selected':''}>${St[k]}</option>`).join('')}</select></td><td style="white-space:nowrap"><button class="btn sec" data-u="${esc(u.u)}" onclick="setUser(this.dataset.u,${i})">บันทึก</button> <button class="btn ghost" style="color:var(--muted)" data-u="${esc(u.u)}" onclick="openPw(this.dataset.u)">รีเซ็ตรหัส</button></td></tr>`).join('')}</table></div>
 <p class="sub">ผู้สมัครใหม่จะอยู่สถานะ “รออนุมัติ” เปลี่ยนเป็น “ใช้งาน” แล้วเลือกบทบาท (ผู้ดู / ผู้บันทึก / ผู้ดูแล) แล้วกดบันทึก</p><div class="foot"><button class="btn ghost" style="color:var(--muted)" onclick="openSet()">กลับ</button></div>`)}
async function setUser(u,i){const r=await api('setuser',{u,role:$('ur'+i).value,status:$('us'+i).value});toast(r.ok?'บันทึกแล้ว':r.err||'ไม่สำเร็จ')}
function openPw(t){openM(`<h2>${t?'รีเซ็ตรหัสผ่าน: '+esc(t):'เปลี่ยนรหัสผ่าน'}</h2>${t?'':'<label>รหัสผ่านเดิม</label><input type="password" id="pw0" autocomplete="current-password">'}<label>รหัสผ่านใหม่ (อย่างน้อย 10 ตัวอักษร)</label><input type="password" id="pw1" autocomplete="new-password"><label>ยืนยันรหัสผ่านใหม่</label><input type="password" id="pw2" autocomplete="new-password">
 <div class="foot"><button class="btn ghost" style="color:var(--muted)" onclick="${t?'openUsers()':'openSet()'}">ยกเลิก</button><button class="btn" data-u="${esc(t||'')}" onclick="savePw(this.dataset.u)">บันทึก</button></div>`)}
async function savePw(t){const n=$('pw1').value;if(n.length<10)return toast('รหัสผ่านอย่างน้อย 10 ตัวอักษร');if(n!==$('pw2').value)return toast('รหัสผ่านใหม่ไม่ตรงกัน');
 const r=t?await api('setuser',{u:t,pw:n}):await api('chpw',{old:$('pw0').value,pw:n});toast(r.ok?'เปลี่ยนรหัสผ่านแล้ว':r.err||'ไม่สำเร็จ');if(r.ok)t?openUsers():openSet()}
function exportJ(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='nakhu_po_'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function importJ(i){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.bills)throw 0;S={...S,bills:d.bills.map(b=>({...b,v:undefined})),people:d.people||[],cos:d.cos||S.cos,meds:d.meds||S.meds};save();toast('นำเข้าแล้ว')}catch(e){toast('ไฟล์ไม่ถูกต้อง')}};r.readAsText(i.files[0])}
$('gf').value=grp;$('yf').value=fy?'1':'0';
render();boot();
